<!DOCTYPE html>

          { p: `1. 今年の旧正月に ${r('行', 'い')}った ところ (今年舊正月去的地方)`, example: "例：家族と行ったレストラン" },
          { p: `2. そこで ${r('食', 'た')}べた もの (在那裡吃的東西)`, example: "例：母が注文した魚料理" },
          { p: `3. そこで ${r('会', 'あ')}った 人 (在那裡見到的人)`, example: "例：久しぶりに会った親戚" },
        ],
        vocab: [
          { jp: `${r('今年', 'ことし')}`, zh: "今年" }, { jp: `そこ`, zh: "那裡(場所)" },
          { jp: `${r('注文', 'ちゅうもん')}した`, zh: "點餐了" }, { jp: `${r('魚', 'さかな')}`, zh: "魚" },
          { jp: `${r('久', 'ひさ')}しぶり`, zh: "好久不見" },
        ]
      }
    ];

    let currentPage = 0;
    let revealed = {};

    function nextPage() {
      if (currentPage < lessonData.length - 1) {
        currentPage++;
        render();
      }
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        render();
      }
    }

    function toggleReveal(pageIdx, itemIdx) {
      const key = `${pageIdx}-${itemIdx}`;
      revealed[key] = !revealed[key];
      render();
    }

    function render() {
      const data = lessonData[currentPage];
      const headerDiv = document.getElementById('app-header');
      const contentDiv = document.getElementById('app-content');
      const footerDiv = document.getElementById('app-footer');

      // 1. Render Header
      headerDiv.innerHTML = `
        <div class="absolute top-0 left-0 w-full h-full opacity-10 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PGNpcmNsZSBjeD0iMTAiIGN5PSIxMCIgcj0iMiIgZmlsbD0iI2ZmZiIvPjwvc3ZnPg==')]"></div>
        <div class="font-bold text-xl tracking-wider flex items-center gap-2 z-10">
           <span class="text-2xl">🇹🇼</span> 台湾の旧正月 (N5文法)
        </div>
        <div class="text-sm font-bold bg-white/20 px-4 py-2 rounded-full backdrop-blur-md z-10 border border-white/30 shadow-sm">
          Page ${currentPage + 1} / ${lessonData.length}
        </div>
      `;

      // 2. Render Main Content
      let specificContent = '';

      if (data.type === 'standard') {
        specificContent = `
          <div class="space-y-6">
            <div class="bg-red-50 border-l-4 border-red-500 p-3 rounded text-red-800 text-sm font-medium">
              <span class="block font-bold text-red-600">文法焦點：${data.grammarPoint}</span>
              <span class="block mt-1 text-red-700 opacity-80">${data.context}</span>
            </div>
            <div class="space-y-5 p-2">
              ${data.contentBlock.map(item => `
                <div class="group">
                  <p class="text-xl sm:text-2xl font-medium text-gray-900 leading-[2.2] tracking-wider">${item.ja}</p>
                  <p class="text-gray-500 text-sm mt-1 pl-1 transition-colors group-hover:text-red-500">${item.zh}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } 
      else if (data.type === 'translation') {
        specificContent = `
          <div class="space-y-5">
            <div class="bg-purple-50 border-l-4 border-purple-500 p-3 rounded text-purple-800 text-sm font-medium">
              <span class="block font-bold text-purple-600">${data.grammarPoint}</span>
              <span class="block mt-1 opacity-80">${data.context}</span>
            </div>
            <div class="space-y-4">
              ${data.questions.map((q, idx) => {
                const isRevealed = revealed[`${currentPage}-${idx}`];
                return `
                <div class="bg-white p-4 rounded-lg shadow-sm border border-purple-100 relative">
                  <p class="text-xl font-bold text-gray-800 mb-2">${q.zh}</p>
                  <p class="text-xs text-gray-400 mb-4">(提示單字: ${q.hint})</p>
                  <div class="flex items-center gap-3">
                    <button onclick="toggleReveal(${currentPage}, ${idx})" class="px-4 py-2 ${isRevealed ? 'bg-gray-100 text-gray-600' : 'bg-purple-100 text-purple-700'} rounded-full text-sm font-bold hover:opacity-80 transition">
                      ${isRevealed ? '隱藏日文' : '顯示日文'}
                    </button>
                    ${isRevealed ? `<span class="text-red-600 font-bold text-xl bg-red-50 px-4 py-2 rounded-md fade-in tracking-widest">${q.ja}</span>` : ''}
                  </div>
                </div>
              `}).join('')}
            </div>
          </div>
        `;
      }
      else if (data.type === 'line') {
        const textSize = data.largeText ? 'text-2xl sm:text-3xl' : 'text-base sm:text-lg';
        specificContent = `
          <div class="space-y-4">
            <div class="bg-green-50 border-l-4 border-green-500 p-3 rounded text-green-800 text-sm font-medium mb-4">
              <span class="block font-bold text-green-600">文法焦點：${data.grammarPoint}</span>
              <span class="block mt-1 text-green-700 opacity-80">${data.context}</span>
            </div>
            <div class="bg-[#849ebf] p-4 rounded-xl shadow-inner h-[320px] overflow-y-auto flex flex-col gap-4 no-scrollbar">
              ${data.chat.map(msg => `
                <div class="flex flex-col ${msg.user === 'tw' ? 'items-end' : 'items-start'}">
                  <div class="flex items-end gap-2 ${msg.user === 'tw' ? 'flex-row-reverse' : ''}">
                    <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-xl shadow shrink-0">
                      ${msg.user === 'jp' ? '🇯🇵' : '🇹🇼'}
                    </div>
                    <div class="max-w-[85%] p-3 rounded-xl shadow-sm relative ${
                      msg.user === 'tw' 
                        ? 'bg-[#85e249] text-black rounded-tr-none' 
                        : 'bg-white text-black rounded-tl-none'
                    }">
                      <p class="${textSize} leading-[1.8] font-medium tracking-wide">${msg.text}</p>
                    </div>
                  </div>
                  <p class="text-xs text-white/90 mt-1 px-14 ${msg.user === 'tw' ? 'text-right' : 'text-left'}">${msg.zh}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
      else if (data.type === 'practice_cloze') {
        specificContent = `
          <div class="space-y-5">
            <div class="bg-blue-50 border-l-4 border-blue-500 p-3 rounded text-blue-800 text-sm font-medium">${data.context}</div>
            <ul class="space-y-4">
              ${data.questions.map((q, idx) => {
                const isRevealed = revealed[`${currentPage}-${idx}`];
                return `
                <li class="bg-white p-4 rounded-lg shadow-sm border border-blue-100">
                  <p class="text-lg mb-3 leading-[2] font-medium tracking-wide">${q.q}</p>
                  <div class="flex items-center gap-3">
                    <button onclick="toggleReveal(${currentPage}, ${idx})" class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm font-bold hover:bg-blue-200 transition">
                      ${isRevealed ? '隱藏答案' : '看答案'}
                    </button>
                    ${isRevealed ? `<span class="text-red-600 font-bold text-xl bg-red-50 px-3 py-1 rounded-md fade-in">${q.a}</span>` : ''}
                    <span class="text-gray-400 text-xs italic ml-auto">${q.hint}</span>
                  </div>
                </li>
              `}).join('')}
            </ul>
          </div>
        `;
      }
      else if (data.type === 'practice_scramble') {
        specificContent = `
          <div class="space-y-5">
            <div class="bg-blue-50 border-l-4 border-blue-500 p-3 rounded text-blue-800 text-sm font-medium">${data.context}</div>
            <div class="space-y-6">
              ${data.questions.map((q, idx) => {
                const isRevealed = revealed[`${currentPage}-${idx}`];
                return `
                <div class="bg-white p-5 rounded-lg shadow-sm border border-blue-100">
                  <div class="flex flex-wrap gap-3 mb-5 justify-center">
                    ${q.words.map(w => `<span class="px-4 py-2 bg-gray-50 border-b-2 border-gray-300 rounded shadow-sm text-lg font-bold text-gray-700">${w}</span>`).join('')}
                  </div>
                  <div class="flex items-center gap-3 border-t border-gray-100 pt-4 justify-center flex-col sm:flex-row">
                    <button onclick="toggleReveal(${currentPage}, ${idx})" class="px-5 py-2 ${isRevealed ? 'bg-gray-100 text-gray-500' : 'bg-blue-500 text-white'} rounded-full text-sm font-bold shadow-sm transition hover:opacity-90">
                      ${isRevealed ? '隱藏解答' : '顯示正確順序'}
                    </button>
                    ${isRevealed ? `<span class="text-red-600 font-bold text-xl sm:text-2xl bg-red-50 px-4 py-2 rounded-lg fade-in tracking-widest text-center">${q.a}</span>` : ''}
                  </div>
                </div>
              `}).join('')}
            </div>
          </div>
        `;
      }
      else if (data.type === 'practice_reason') {
        specificContent = `
          <div class="space-y-5">
            <div class="bg-green-50 border-l-4 border-green-500 p-3 rounded text-green-800 text-sm font-medium">
              <span class="block font-bold text-green-600">文法焦點：${data.grammarPoint}</span>
              <span class="block mt-1 opacity-80">${data.context}</span>
            </div>
            <div class="space-y-4">
              ${data.qna.map((item, idx) => {
                const isRevealed = revealed[`${currentPage}-${idx}`];
                return `
                <div class="bg-white p-4 rounded-lg shadow-sm border border-green-100 cursor-pointer" onclick="toggleReveal(${currentPage}, ${idx})">
                  <div class="flex gap-3 mb-2 items-start">
                    <span class="font-bold text-green-600 text-xl">Q:</span>
                    <p class="text-xl leading-[1.8] font-medium">${item.q}</p>
                  </div>
                  <div class="flex gap-3 pl-4 border-l-2 border-green-200 py-2 bg-green-50 rounded-r-lg items-center min-h-[50px]">
                    <span class="font-bold text-red-600 text-xl">A:</span>
                    ${isRevealed 
                      ? `<p class="text-xl leading-[1.8] font-medium text-gray-800 fade-in tracking-wider">${item.a}</p>` 
                      : `<button class="px-4 py-1.5 bg-green-200 text-green-800 rounded-full text-sm font-bold shadow-sm hover:bg-green-300 transition">看答案</button>`
                    }
                  </div>
                </div>
              `}).join('')}
            </div>
          </div>
        `;
      }
      else if (data.type === 'practice_free') {
        specificContent = `
          <div class="space-y-5">
            <div class="bg-blue-50 border-l-4 border-blue-500 p-3 rounded text-blue-800 text-sm font-medium">
               <span class="block font-bold text-blue-600">文法焦點：${data.grammarPoint}</span>
               <span class="block mt-1 opacity-80">${data.context}</span>
            </div>
            <div class="space-y-4">
              ${data.prompts.map(item => `
                <div class="bg-white p-4 rounded-lg shadow-sm border border-dashed border-blue-300">
                  <p class="text-base sm:text-lg font-bold text-blue-800 mb-2">${item.p}</p>
                  <textarea class="w-full h-16 bg-gray-50 rounded border border-gray-200 p-3 text-gray-700 text-lg resize-none focus:outline-none focus:ring-2 focus:ring-blue-200" placeholder="請在此寫下你的句子..."></textarea>
                  <p class="text-xs text-gray-500 mt-2 text-right">${item.example}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 3. Render Title & Vocabulary (Common)
      const vocabHTML = `
        <div class="mt-8 pt-4 border-t-2 border-dashed border-gray-200">
          <h3 class="text-base font-bold text-gray-700 mb-3 flex items-center gap-2 uppercase tracking-wider">
            <span class="w-1.5 h-5 bg-red-500 rounded-full inline-block shadow-sm"></span>
            今ページの単語（たんご）
          </h3>
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
            ${data.vocab.map(v => `
              <div class="flex flex-col items-center justify-center bg-gradient-to-b from-white to-red-50 border border-red-100 p-2 rounded-xl shadow-sm text-center">
                <span class="text-base font-bold text-gray-800 leading-tight mb-1">${v.jp}</span>
                <span class="text-xs text-gray-500 w-full border-t border-red-100/50 pt-1">${v.zh}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      contentDiv.innerHTML = `
        <div class="flex items-center gap-3 mb-6 pb-4 border-b-2 border-red-100/50">
          <div class="w-10 h-10 bg-red-50 rounded-lg shadow-sm flex items-center justify-center text-2xl">${data.icon || '📖'}</div>
          <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 leading-snug tracking-wide">
            ${data.title}
          </h2>
        </div>
        <div class="flex-1">${specificContent}</div>
        ${vocabHTML}
      `;

      // 4. Render Footer
      footerDiv.innerHTML = `
        <button onclick="prevPage()" class="flex items-center justify-center gap-2 w-28 py-3 rounded-xl font-bold transition-all ${currentPage === 0 ? 'text-gray-300 bg-gray-100/50 cursor-not-allowed' : 'text-red-600 bg-white hover:bg-red-50 border border-red-100 shadow-sm hover:shadow'}" ${currentPage === 0 ? 'disabled' : ''}>
          ◀ 前へ
        </button>
        <button onclick="nextPage()" class="flex items-center justify-center gap-2 w-28 py-3 rounded-xl font-bold transition-all ${currentPage === lessonData.length - 1 ? 'text-gray-300 bg-gray-100/50 cursor-not-allowed' : 'text-white bg-gradient-to-r from-red-600 to-red-500 hover:from-red-700 hover:to-red-600 shadow-md hover:shadow-lg border border-red-600'}" ${currentPage === lessonData.length - 1 ? 'disabled' : ''}>
          次へ ▶
        </button>
      `;
    }

    // 初始化渲染
    render();
  </script>
</body>
</html>
